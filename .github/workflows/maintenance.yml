name: Maintenance

on:
  workflow_call:
    inputs:
      check_flake:
        description: "Whether to evaluate the caller flake before running maintenance."
        required: false
        type: boolean
        default: true
      maintenance_command:
        description: "Optional repo-local maintenance command to run after flake evaluation."
        required: false
        type: string
        default: ""
      checkout_ref:
        description: "Optional branch, tag, or SHA to check out before running maintenance."
        required: false
        type: string
        default: ""
      report_path:
        description: "Path to write a maintenance report artifact."
        required: false
        type: string
        default: maintenance-report.md
      artifact_path:
        description: "Path or glob to upload as the maintenance artifact."
        required: false
        type: string
        default: ""
      report_artifact_name:
        description: "Uploaded artifact name for the maintenance report."
        required: false
        type: string
        default: maintenance-report
      commit_paths:
        description: "Optional newline-separated paths to commit after maintenance."
        required: false
        type: string
        default: ""
      commit_message:
        description: "Commit message for generated maintenance updates."
        required: false
        type: string
        default: "chore: refresh maintenance outputs"
      push_branch:
        description: "Branch to push generated maintenance commits to."
        required: false
        type: string
        default: ""
      create_pull_request:
        description: "Whether generated maintenance updates should open or update a pull request."
        required: false
        type: boolean
        default: false
      pull_request_base_branch:
        description: "Base branch for generated maintenance pull requests."
        required: false
        type: string
        default: ""
      pull_request_title:
        description: "Title for generated maintenance pull requests."
        required: false
        type: string
        default: "chore: refresh maintenance outputs"
      pull_request_body:
        description: "Body for generated maintenance pull requests."
        required: false
        type: string
        default: "Automated maintenance refresh."
      pull_request_labels:
        description: "Optional newline-separated labels for generated maintenance pull requests."
        required: false
        type: string
        default: ""
      timeout_minutes:
        description: "Maximum maintenance runtime in minutes."
        required: false
        type: number
        default: 30
    secrets:
      MONARCHIC_GITHUB_PAT:
        description: "Optional GitHub token for private flake inputs outside the caller repository."
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  maintenance:
    name: Maintenance
    runs-on:
      - self-hosted
      - Linux
      - X64
      - monarchic-local
      - nixos
    timeout-minutes: ${{ inputs.timeout_minutes }}

    env:
      MONARCHIC_GITHUB_TOKEN: ${{ secrets.MONARCHIC_GITHUB_PAT || github.token }}
      REPORT_PATH: ${{ inputs.report_path }}
      MAINTENANCE_COMMAND: ${{ inputs.maintenance_command }}
      COMMIT_PATHS: ${{ inputs.commit_paths }}
      COMMIT_MESSAGE: ${{ inputs.commit_message }}
      PUSH_BRANCH: ${{ inputs.push_branch }}
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        access-tokens = github.com=${{ secrets.MONARCHIC_GITHUB_PAT || github.token }}
        accept-flake-config = true
        substituters = https://cache.nixos.org
        trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWVMkYbcAA1q6Y2OkQbBWBV88F2rI=

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ env.MONARCHIC_GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.MONARCHIC_GITHUB_PAT || github.token }}
            accept-flake-config = true
            substituters = https://cache.nixos.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWVMkYbcAA1q6Y2OkQbBWBV88F2rI=

      - name: Run maintenance checks
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "# Maintenance Report"
            echo
            echo "- Repository: ${GITHUB_REPOSITORY}"
            echo "- Ref: ${GITHUB_REF}"
            echo "- SHA: ${GITHUB_SHA}"
            echo "- Event: ${GITHUB_EVENT_NAME}"
            echo "- Runner: ${RUNNER_NAME}"
            echo
          } > "$REPORT_PATH"

          if [ "${{ inputs.check_flake }}" = "true" ]; then
            {
              echo "## Nix flake check"
            } >> "$REPORT_PATH"
            if nix flake check --no-build >> "$REPORT_PATH" 2>&1; then
              {
                echo
                echo "Result: pass"
              } >> "$REPORT_PATH"
            else
              {
                echo
                echo "Result: fail"
              } >> "$REPORT_PATH"
              exit 1
            fi
          fi

          if [ -n "$MAINTENANCE_COMMAND" ]; then
            {
              echo
              echo "## Maintenance command"
              echo '```console'
              echo "$MAINTENANCE_COMMAND"
              echo '```'
            } >> "$REPORT_PATH"
            if bash -euo pipefail -c "$MAINTENANCE_COMMAND" >> "$REPORT_PATH" 2>&1; then
              {
                echo
                echo "Result: pass"
              } >> "$REPORT_PATH"
            else
              {
                echo
                echo "Result: fail"
              } >> "$REPORT_PATH"
              exit 1
            fi
          fi

          cat "$REPORT_PATH" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit maintenance updates
        if: ${{ inputs.commit_paths != '' && ! inputs.create_pull_request && github.event_name != 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t commit_paths < <(printf '%s\n' "$COMMIT_PATHS" | sed '/^[[:space:]]*$/d')
          if [ "${#commit_paths[@]}" -eq 0 ]; then
            echo "No commit paths configured."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${commit_paths[@]}"

          if git diff --cached --quiet; then
            echo "No maintenance updates to commit."
            exit 0
          fi

          git commit -m "$COMMIT_MESSAGE"
          target_branch="${PUSH_BRANCH:-${GITHUB_REF_NAME}}"
          git push origin "HEAD:${target_branch}"

      - name: Create or update maintenance pull request
        if: ${{ inputs.commit_paths != '' && inputs.create_pull_request && github.event_name != 'pull_request' }}
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ env.MONARCHIC_GITHUB_TOKEN }}
          branch: ${{ inputs.push_branch }}
          base: ${{ inputs.pull_request_base_branch || inputs.checkout_ref || github.ref_name }}
          title: ${{ inputs.pull_request_title }}
          commit-message: ${{ inputs.commit_message }}
          body: ${{ inputs.pull_request_body }}
          labels: ${{ inputs.pull_request_labels }}
          add-paths: ${{ inputs.commit_paths }}

      - name: Upload maintenance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.report_artifact_name }}
          path: ${{ inputs.artifact_path || inputs.report_path }}
          if-no-files-found: error
